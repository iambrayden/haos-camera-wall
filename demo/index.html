<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera Wall Demo</title>
<style>
  body { margin: 0; padding: 16px; background: #0b0c0e; color: #e6edf2; font-family: system-ui, sans-serif; }
  main { max-width: 2400px; margin: 0 auto; }
</style>
</head>
<body>
<main>
  <camera-wall-card id="card"></camera-wall-card>
</main>

<script type="module">
customElements.define("ha-camera-stream", class extends HTMLElement {
  set stateObj(st) { this._st = st; this._paint(); }
  get stateObj() { return this._st; }
  connectedCallback() {
    this.style.cssText += ";background:#000";
    this._img = document.createElement("img");
    this._img.style.cssText = "width:100%;height:100%;object-fit:cover;display:block";
    this._clock = document.createElement("span");
    this._clock.style.cssText = "position:absolute;right:6px;bottom:24px;font:10px monospace;color:#fff;background:rgba(0,0,0,.5);padding:1px 4px;border-radius:3px";
    this.append(this._img, this._clock);
    this._paint();
    this._t = setInterval(() => (this._clock.textContent = new Date().toLocaleTimeString()), 1000);
  }
  disconnectedCallback() { clearInterval(this._t); }
  _paint() { if (this._img && this._st) this._img.src = this._st.attributes.entity_picture; }
});
import "../camera-wall-card.js";

const areas = { outside: "Outside", garage: "Garage", main: "Main Floor", upstairs: "Upstairs", barn: "Barn" };
const cams = [
  ["Front Door", "outside", "porch", true, null],
  ["Back Door", "outside", "porch", true, 64],
  ["Driveway", "outside", "outdoor", false, null],
  ["Front Yard", "outside", "outdoor", false, 88],
  ["Back Yard", "outside", "outdoor", false, 41],
  ["Side Gate", "outside", "outdoor", false, 17],
  ["Patio", "outside", "outdoor", false, 72],
  ["Pool", "outside", "outdoor", false, 93],
  ["Street", "outside", "outdoor", false, null],
  ["Mailbox", "outside", "outdoor", false, 8],
  ["Shed", "outside", "outdoor", false, 55],
  ["Garden", "outside", "outdoor", false, 61],
  ["Garage Inside", "garage", "indoor", false, null],
  ["Garage Door", "garage", "outdoor", false, null],
  ["Workshop", "garage", "indoor", false, null],
  ["Living Room", "main", "indoor", false, null],
  ["Kitchen", "main", "indoor", false, null],
  ["Dining Room", "main", "indoor", false, null],
  ["Entry Hall", "main", "indoor", false, null],
  ["Office", "main", "indoor", false, null],
  ["Basement Stairs", "main", "indoor", false, null],
  ["Laundry", "main", "indoor", false, null],
  ["Nursery", "upstairs", "indoor", false, null],
  ["Upstairs Hall", "upstairs", "indoor", false, null],
  ["Playroom", "upstairs", "indoor", false, null],
  ["Guest Room", "upstairs", "indoor", false, null],
  ["Barn Door", "barn", "outdoor", false, 35],
  ["Barn Inside", "barn", "indoor", false, null],
  ["Pasture", "barn", "outdoor", false, 22],
  ["Back Gate", "barn", "outdoor", false, 12],
];

const ago = (min) => new Date(Date.now() - min * 60000).toISOString();
const states = {};
const entities = {};
const devices = {};
const slug = (n) => n.toLowerCase().replace(/[^a-z0-9]+/g, "_");
const offline = new Set(["Shed", "Back Gate"]);
cams.forEach(([name, area, pic, doorbell, battery], i) => {
  const b = slug(name);
  const dev = `dev_${b}`;
  devices[dev] = { name, area_id: area };
  const cam = `camera.${b}_live_view`;
  states[cam] = { state: offline.has(name) ? "unavailable" : "idle", attributes: { friendly_name: `${name} Live view`, entity_picture: `${pic}.svg?cam=${b}` }, last_changed: ago(300) };
  entities[cam] = { entity_id: cam, device_id: dev, platform: "ring", translation_key: "live_view" };
  const rec = `camera.${b}_last_recording`;
  states[rec] = { state: "idle", attributes: { friendly_name: `${name} Last recording`, entity_picture: `${pic}.svg?rec=${b}` } };
  entities[rec] = { entity_id: rec, device_id: dev, platform: "ring", translation_key: "last_recording" };
  const mo = `event.${b}_motion`;
  states[mo] = { state: ago(5 + i * 37), attributes: { event_type: "motion", device_class: "motion" } };
  entities[mo] = { entity_id: mo, device_id: dev, platform: "ring", translation_key: "motion" };
  if (doorbell) {
    const d = `event.${b}_ding`;
    states[d] = { state: ago(140 + i * 50), attributes: { event_type: "ding", device_class: "doorbell" } };
    entities[d] = { entity_id: d, device_id: dev, platform: "ring", translation_key: "ding" };
  }
  if (battery != null) {
    const s = `sensor.${b}_battery`;
    states[s] = { state: String(battery), attributes: { device_class: "battery", unit_of_measurement: "%" } };
    entities[s] = { entity_id: s, device_id: dev, platform: "ring", translation_key: null };
  }
});
states["camera.kitchen_live_view"].attributes.entity_picture = "missing.jpg";
states["camera.office_live_view"].attributes.entity_picture = "missing.jpg";
states["event.driveway_motion"].state = ago(0.2);
states["event.nursery_motion"].state = ago(0.5);
states["event.front_door_motion"].state = ago(0.4);

const unifi = [["Lake Dock", "outdoor"], ["Lake Driveway", "outdoor"], ["Lake Kitchen", "indoor"], ["Lake Doorbell", "porch"]];
unifi.forEach(([name, pic]) => {
  const b = slug(name);
  const dev = `dev_${b}`;
  devices[dev] = { name, area_id: null };
  for (const [suffix, tk] of [["high_resolution_channel", "high"], ["medium_resolution_channel", "medium"], ["package_camera", "package"]]) {
    if (suffix === "package_camera" && name !== "Lake Doorbell") continue;
    const id = `camera.${b}_${suffix}`;
    states[id] = { state: "streaming", attributes: { friendly_name: `${name} ${suffix.replace(/_/g, " ")}`, entity_picture: `${pic}.svg?u=${b}` } };
    entities[id] = { entity_id: id, device_id: dev, platform: "unifiprotect" };
  }
  for (const [suffix, dc, on] of [["motion", "motion", name === "Lake Dock"], ["person_detected", "occupancy", name === "Lake Dock"], ["vehicle_detected", "occupancy", false], ["animal_detected", "occupancy", false]]) {
    const id = `binary_sensor.${b}_${suffix}`;
    states[id] = { state: on ? "on" : "off", attributes: { device_class: dc }, last_changed: ago(20) };
    entities[id] = { entity_id: id, device_id: dev, platform: "unifiprotect" };
  }
  if (name === "Lake Doorbell") {
    states["binary_sensor.lake_doorbell_doorbell"] = { state: "off", attributes: { device_class: "occupancy" }, last_changed: ago(90) };
    entities["binary_sensor.lake_doorbell_doorbell"] = { entity_id: "binary_sensor.lake_doorbell_doorbell", device_id: dev, platform: "unifiprotect" };
  }
});

async function callApi(method, path) {
  const ids = decodeURIComponent(path.split("filter_entity_id=")[1].split("&")[0]).split(",");
  return ids.map((id, i) => {
    const n = 2 + (i % 5);
    const rows = [{ entity_id: id, state: ago(1500), last_changed: ago(1500) }];
    for (let k = n; k > 0; k--) rows.push({ state: ago(k * (60 + i * 13)), last_changed: ago(k * (60 + i * 13)) });
    return rows;
  });
}

const card = document.getElementById("card");
const areaReg = Object.fromEntries(Object.entries(areas).map(([id, name]) => [id, { area_id: id, name }]));
let dashboard = null;
async function callWS(msg) {
  if (msg.type === "lovelace/config") return JSON.parse(JSON.stringify(dashboard));
  if (msg.type === "lovelace/config/save") {
    dashboard = msg.config;
    window.savedDashboard = msg.config;
    const cardCfg = dashboard.views[0].cards[0];
    setTimeout(() => { card.setConfig(cardCfg); push(); }, 50);
    return null;
  }
  throw new Error(`unknown ${msg.type}`);
}
const push = () => { card.hass = { states: { ...states }, entities, devices, areas: areaReg, callApi, callWS, user: { is_admin: true }, hassUrl: (p) => p }; };

const params = new URLSearchParams(location.search);
const config = { title: "Cameras", refresh: 10, ...(params.has("cols") ? { columns: Number(params.get("cols")) } : {}) };
if (params.has("props")) {
  config.views = [
    { name: "Main House", cameras: [{ entity: "camera.front_door_live_view", name: "Porch" }, "camera.driveway_live_view", "camera.living_room_live_view", "camera.kitchen_live_view", "camera.nursery_live_view", "camera.office_live_view"] },
    { name: "Farm", cameras: ["camera.barn_door_live_view", "camera.barn_inside_live_view", "camera.pasture_live_view", "camera.back_gate_live_view"] },
    { name: "Lake House", cameras: [{ entity: "camera.lake_dock_high_resolution_channel", name: "Boat Dock" }, "camera.lake_driveway_high_resolution_channel", "camera.lake_kitchen_high_resolution_channel", "camera.lake_doorbell_high_resolution_channel"] },
    { name: "Rental", cameras: ["camera.street_live_view", "camera.mailbox_live_view", "camera.shed_live_view"] },
  ];
} else if (params.has("views")) {
  config.views = [
    { name: "Doors", cameras: ["camera.front_door_live_view", "camera.back_door_live_view", "camera.side_gate_live_view", "camera.garage_door_live_view", "camera.barn_door_live_view", "camera.back_gate_live_view"] },
    { name: "Yard", cameras: ["camera.driveway_live_view", "camera.front_yard_live_view", "camera.back_yard_live_view", "camera.patio_live_view", "camera.pool_live_view", "camera.street_live_view", "camera.pasture_live_view", "camera.garden_live_view"] },
    { name: "Inside", cameras: ["camera.living_room_live_view", "camera.kitchen_live_view", "camera.office_live_view", "camera.nursery_live_view"] },
    { name: "Everything" },
  ];
}
const cardConfig = { type: "custom:camera-wall-card", ...config };
dashboard = { title: "Cameras", views: [{ title: "Cameras", panel: true, cards: [cardConfig] }] };
card.setConfig(JSON.parse(JSON.stringify(cardConfig)));
push();
if (params.has("editor")) {
  const ed = document.createElement("camera-wall-card-editor");
  ed.style.cssText = "display:block;max-width:640px;margin:16px auto;padding:16px;background:#1c1c1c;border-radius:12px;--primary-color:#3d8bff;--secondary-text-color:#9aa;--primary-text-color:#e6edf2;--divider-color:#3a3a3a";
  document.querySelector("main").prepend(ed);
  ed.hass = { states, entities, devices, areas: areaReg };
  ed.setConfig(config);
  ed.addEventListener("config-changed", (e) => { window.lastConfig = e.detail.config; card.setConfig(e.detail.config); push(); ed.setConfig(e.detail.config); });
}

window.addEventListener("hass-more-info", (e) => console.log("MORE-INFO:", e.detail.entityId));
const names = cams.map(([n]) => slug(n));
setInterval(() => {
  const b = names[Math.floor(Math.random() * names.length)];
  states[`event.${b}_motion`] = { ...states[`event.${b}_motion`], state: new Date().toISOString() };
  push();
}, 7000);
if (params.has("ding")) setTimeout(() => {
  states["event.front_door_ding"] = { ...states["event.front_door_ding"], state: new Date().toISOString() };
  push();
}, 1500);
</script>
</body>
</html>
